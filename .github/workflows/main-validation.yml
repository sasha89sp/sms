name: Main Validation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-main:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check documentation and manifest
        shell: pwsh
        run: |
          foreach ($file in @('AGENTS.md', 'ROOT_MAP.md', 'MAP.md', 'HANDOFF.yaml', 'pubspec.yaml')) {
            if (!(Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test
