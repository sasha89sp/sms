name: Build Huawei Modem Manager (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner scaffold
        shell: pwsh
        run: ./tool/create_windows_runner.ps1

      - name: Resolve packages
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package application
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (!(Test-Path $release)) {
            $release = "build/windows/runner/Release"
          }
          if (!(Test-Path $release)) {
            throw "Flutter Windows Release folder was not found."
          }
          Compress-Archive -Path "$release/*" -DestinationPath "HuaweiModemManager-Windows-x64.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HuaweiModemManager-Windows-x64
          path: HuaweiModemManager-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
