name: Windows Release Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate pubspec.yaml encoding and indentation
        shell: pwsh
        run: |
          if (!(Test-Path 'pubspec.yaml')) {
            throw "pubspec.yaml was not found in repository root."
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'pubspec.yaml'))
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "pubspec.yaml contains UTF-8 BOM, which breaks Flutter YAML scanner."
          }
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          if ($text.Contains("`t")) {
            throw "pubspec.yaml contains tab characters."
          }

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner scaffold
        shell: pwsh
        run: ./tool/create_windows_runner.ps1

      - name: Resolve packages
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package application
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (!(Test-Path $release)) {
            $release = "build/windows/runner/Release"
          }
          if (!(Test-Path $release)) {
            throw "Flutter Windows Release folder was not found."
          }
          Compress-Archive -Path "$release/*" -DestinationPath "HuaweiModemManager-Windows-x64.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HuaweiModemManager-Windows-x64
          path: HuaweiModemManager-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
