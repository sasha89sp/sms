name: PR Checks

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-analyze-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify required project documentation
        shell: pwsh
        run: |
          $required = @('AGENTS.md', 'ROOT_MAP.md', 'MAP.md', 'HANDOFF.yaml', 'pubspec.yaml')
          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Required project file is missing: $file"
            }
          }
          $pubspec = Get-Content -Raw -Path 'pubspec.yaml'
          if ($pubspec.Contains("`t")) {
            throw "pubspec.yaml contains tab characters; only spaces are allowed."
          }

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test
