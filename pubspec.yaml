name: huawei_modem_manager
description: Windows desktop manager and automation tool for Huawei E173 USB modem.
publish_to: 'none'
version: 2.1.15+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  serial_port_win32: ^3.0.0
  shared_preferences: ^2.5.3
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  path_provider: ^2.1.5
  csv: ^6.0.0
  excel: ^4.0.6
  ffi: ^2.1.0
  window_manager: ^0.4.3
  tray_manager: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
    - assets/sms_notify.wav
